<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de revisión</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--bd:#e6e4df;--ok:#1e7a3c;--ko:#c62828}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
header{background:var(--card);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
main{max-width:640px;margin:auto;padding:12px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;margin-bottom:8px}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px}
.pri{background:var(--tx);color:#fff;border-color:var(--tx);width:100%;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.card h2{font-size:16px;margin:4px 0 6px}
.meta{font-size:13px;color:var(--mu)}
.d{font-size:14px;margin:8px 0}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.verde{background:var(--ok);color:#fff;border-color:var(--ok)}
.rojo{color:var(--ko);border-color:var(--ko)}
.vacio{text-align:center;color:var(--mu);padding:30px 0}
#err{color:var(--ko);font-size:14px}
a{color:var(--tx);font-size:14px}
</style></head><body>
<header><h1>Panel de revisión</h1><button id="salir" hidden>Salir</button></header>
<main>
<form id="login" hidden><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required><button class="pri">Entrar</button><p id="err"></p></form>
<div id="app" hidden>
<div class="tabs"><button data-tab="pendiente" class="on">Pendientes</button><button data-tab="aprobado">Aprobados</button><button data-tab="reportes">Reportes</button></div>
<div id="extra"></div><div id="lista"></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_='https://cmtrtvpanfhrbpdztkvn.supabase.co', KEY='sb_publishable_UZAKaPQsCY6pEXo086lXOw_0FyRqEzE';
const db=supabase.createClient(URL_,KEY);
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cache=new Map();
let tab='pendiente';
async function iniciar(){
 const {data:{session}}=await db.auth.getSession();
 $('login').hidden=!!session;$('app').hidden=!session;$('salir').hidden=!session;
 if(session)cargar();
}
$('login').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 $('err').textContent=error?'Email o contraseña incorrectos.':'';
 if(!error)iniciar();
});
$('salir').onclick=async()=>{await db.auth.signOut();iniciar()};
const fallo=err=>{$('lista').innerHTML=`<p class="vacio">Error: ${e(err.message)}</p>`};
const fecha=p=>[...new Set([p.fecha_inicio,p.fecha_fin].filter(Boolean))].join(' → ');
async function cargar(){
 $('lista').innerHTML='<p class="vacio">Cargando…</p>';$('extra').innerHTML='';cache.clear();
 if(tab==='reportes'){
  const {data,error}=await db.from('reportes').select('id,motivo,creado_en,planes(id,nombre,fuente_id,fecha_fin)').order('creado_en',{ascending:false});
  if(error)return fallo(error);
  data.forEach(r=>r.planes&&cache.set(r.planes.id,r.planes));
  $('lista').innerHTML=data.length?data.map(r=>`<div class="card"><h2>${e(r.planes?r.planes.nombre:'Plan ya borrado')}</h2><p class="d">${e(r.motivo)}</p><div class="meta">${new Date(r.creado_en).toLocaleString('es-ES')}</div><div class="acc">${r.planes?`<button class="rojo" data-desc="${r.planes.id}">Quitar plan</button>`:''}<button data-ign="${r.id}">Ignorar</button></div></div>`).join(''):'<p class="vacio">No hay reportes 🎉</p>';
  return;
 }
 const {data,error}=await db.from('planes').select('*').eq('estado',tab).order('fecha_inicio',{ascending:true,nullsFirst:true}).limit(500);
 if(error)return fallo(error);
 data.forEach(p=>cache.set(p.id,p));
 if(tab==='pendiente'&&data.length)$('extra').innerHTML=`<button class="verde" style="width:100%;margin-bottom:12px" data-todos="1">Aprobar los ${data.length} pendientes</button>`;
 $('lista').innerHTML=data.length?data.map(p=>{const url=/^https:\/\//i.test(p.url_fuente||'')?p.url_fuente:null;
  return `<div class="card"><div class="meta">${e(p.categoria||'sin categoría')} · ${e(p.precio)} · ${e(fecha(p))}</div><h2>${e(p.nombre)}</h2><div class="meta">📍 ${e(p.lugar)}${p.horario?' · 🕐 '+e(p.horario):''}</div><p class="d">${e(p.descripcion)}</p>${url?`<a href="${e(url)}" target="_blank" rel="noopener">Ver fuente ↗</a>`:''}
  <div class="acc">${tab==='pendiente'?`<button class="verde" data-est="aprobado" data-id="${p.id}">✓ Aprobar</button>`:`<button data-est="pendiente" data-id="${p.id}">↩ A pendiente</button>`}<button class="rojo" data-desc="${p.id}">✕ Descartar</button></div></div>`}).join('')
  :`<p class="vacio">No hay planes ${tab==='pendiente'?'pendientes':'aprobados'}.</p>`;
}
async function descartar(id){
 const p=cache.get(id);
 if(p&&p.fuente_id){const {error}=await db.from('descartados').upsert({fuente_id:p.fuente_id,fecha_fin:p.fecha_fin});if(error)return fallo(error)}
 const {error}=await db.from('planes').delete().eq('id',id);
 if(error)return fallo(error);
 cargar();
}
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('button');if(!b)return;const ds=b.dataset;
 if(ds.tab){tab=ds.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));cargar()}
 else if(ds.est){b.disabled=true;const {error}=await db.from('planes').update({estado:ds.est}).eq('id',+ds.id);error?fallo(error):cargar()}
 else if(ds.desc){if(confirm('¿Descartar este plan? Desaparecerá y la IA no lo volverá a traer.')){b.disabled=true;descartar(+ds.desc)}}
 else if(ds.ign){b.disabled=true;const {error}=await db.from('reportes').delete().eq('id',+ds.ign);error?fallo(error):cargar()}
 else if(ds.todos){if(confirm('¿Aprobar todos los pendientes?')){b.disabled=true;const {error}=await db.from('planes').update({estado:'aprobado'}).eq('estado','pendiente');error?fallo(error):cargar()}}
});
iniciar();
</script></body></html>
