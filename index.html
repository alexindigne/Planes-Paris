<link rel="manifest" href="/manifest.json?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="Planinparis — never miss what's on in Paris">
<meta property="og:description" content="The best plans in Paris, all in one place. Hand-picked every week so you never miss what's on.">
<meta property="og:url" content="https://planinparis.com/">
<meta property="og:image" content="https://planinparis.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://planinparis.com/og.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#fff;--soft:#f4f3ef;--tx:#1d1d1f;--mu:#6b6b70;--ac:#ff4d2e;--ac2:#d93a1c;--bd:#ebe9e4;--ok:#1e7a3c;--ease:cubic-bezier(.2,.8,.2,1);--hdr:180px;--nav:64px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ic{flex:none;display:block}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:2000;background:rgba(255,255,255,.95);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
header.sc{border-bottom-color:var(--bd)}
.hin{max-width:720px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 20px 12px}
.logo{display:flex;align-items:center;min-height:36px;margin-bottom:10px}
.logo b{font-size:23px;font-weight:800;letter-spacing:-.045em}
.logo b span{color:var(--ac)}
.qbox{position:relative;margin-bottom:12px}
.qbox>.ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);pointer-events:none}
#q{width:100%;height:52px;border:1px solid var(--bd);background:#fff;border-radius:26px;padding:0 50px 0 48px;font-size:16px;font-weight:500;outline:none;box-shadow:0 3px 14px rgba(0,0,0,.08);-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--mu)}
#q:focus{border-color:var(--tx)}
#q::-webkit-search-cancel-button{display:none}
#qx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.row::-webkit-scrollbar{display:none}
#pills{padding-top:10px}#pills:empty{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;border:1px solid #dcdad4;background:#fff;border-radius:20px;padding:0 16px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chip .n{min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--ac2);color:#fff;font-size:11px;text-align:center;padding:0 5px}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;border:0;border-radius:16px;padding:0 12px;font-size:13px;font-weight:600;background:var(--soft);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

main{max-width:720px;margin:auto;padding:0 0 calc(var(--nav) + 48px + env(safe-area-inset-bottom))}

/* ---------- Rows ---------- */
.fila{padding-top:28px}
.fh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px 14px}
.fh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.fh p{margin:3px 0 0;font-size:13px;color:var(--mu)}
.vt-b{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid #dcdad4;background:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.carr{display:flex;gap:14px;overflow-x:auto;padding:0 20px 4px;scroll-snap-type:x mandatory;scroll-padding-left:20px;scrollbar-width:none;overscroll-behavior-x:contain}
.carr::-webkit-scrollbar{display:none}

/* ---------- Plan cards ---------- */
.rc{position:relative;flex:none;width:min(38vw,156px);scroll-snap-align:start}
.rc.big{width:min(80vw,340px)}
.rc.big .ft{aspect-ratio:4/3}
.rc.vert{width:min(42vw,176px)}
.rc.vert .ft{aspect-ratio:3/4}
.rl{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.ft{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--c2,#ececee)}
.rc.big .ft,.lc .ft{border-radius:16px}
.lc .ft{aspect-ratio:4/3}
.ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--c1);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag{position:absolute;top:8px;left:8px;height:24px;padding:0 9px;border-radius:12px;background:#fff;color:var(--tx);font-size:11px;font-weight:700;display:inline-flex;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.14)}
.tag.imp{background:var(--tx);color:#fff}
.tag.urge{color:#b42318}
.hrt{position:absolute;top:4px;right:4px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.hrt svg{fill:rgba(0,0,0,.32);stroke:#fff;stroke-width:1.8;transition:fill .2s}
.hrt.on svg{fill:var(--ac)}
.pop svg{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3)}65%{transform:scale(.9)}100%{transform:scale(1)}}
.rt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rt b{font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc.big .rt b,.lc .rt b{font-size:17px}
.rt>span{font-size:12px;line-height:1.45;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .rt>span{font-size:14px}
.rt .s2{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rt strong{color:var(--tx);font-weight:700}
.rt strong.g{color:var(--ok)}
.rr{display:inline-flex;align-items:center;gap:3px;color:var(--tx);font-weight:600;vertical-align:-1px}
.todo{flex:none;width:min(38vw,156px);scroll-snap-align:start;text-decoration:none;color:inherit}
.todo.big{width:min(80vw,340px)}
.todo.big .ft{aspect-ratio:4/3}
.todo.vert{width:min(42vw,176px)}
.todo.vert .ft{aspect-ratio:3/4}
.todo .ft{background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.todo .ci{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:6px}
.todo b{font-size:15px;font-weight:700}
.todo small{font-size:13px;color:var(--mu)}

/* ---------- Row layouts (each theme looks different) ---------- */
.rc.wide{width:min(84vw,360px)}
.rc.wide .ft{aspect-ratio:4/3;border-radius:16px}
.rc.wide .rt b{font-size:17px}
.top{display:flex;gap:2px;overflow-x:auto;padding:0 20px 4px;scroll-snap-type:x mandatory;scroll-padding-left:20px;scrollbar-width:none;overscroll-behavior-x:contain}
.top::-webkit-scrollbar{display:none}
.tk{--w:min(38vw,156px);flex:none;display:flex;align-items:flex-start;scroll-snap-align:start;padding-right:10px}
.tk .num{flex:none;font-size:112px;font-weight:800;line-height:.8;letter-spacing:-.08em;color:#fff;-webkit-text-stroke:2px var(--tx);paint-order:stroke;margin:calc(var(--w) - 90px) -6px 0 0;position:relative;z-index:0;user-select:none}
.tk .rc{width:var(--w);z-index:1}
.lis{display:flex;flex-direction:column;padding:0 20px}
.li{position:relative;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.li .rl{flex-direction:row;align-items:center;gap:14px;padding:12px 40px 12px 0}
.li .ft{flex:none;width:76px;height:76px;aspect-ratio:auto;border-radius:12px}
.li .cov span{display:none}
.li .hrt{top:50%;right:-10px;transform:translateY(-50%)}
.li .hrt svg{fill:none;stroke:var(--tx)}
.li .hrt.on svg{fill:var(--ac);stroke:var(--ac)}
.rt>span.kk{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac2)}
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;padding:0 20px}
.gr .rc{width:auto}
.gr .ft{aspect-ratio:4/3}
.gr .rt b{font-size:14px}
.gr .rt>span{font-size:12px}
.gr .tag{top:8px;left:8px;height:24px;padding:0 9px;font-size:11px}
.gr.full{padding-top:16px;gap:24px 14px}
@media(min-width:620px){.gr.full{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vermas{display:block;margin:16px 20px 0;padding:13px;border:1px solid #dcdad4;border-radius:12px;text-align:center;font-size:14px;font-weight:700;text-decoration:none;color:var(--tx)}

/* Mosaic: one big featured plan + two small ones */
.mos{display:flex;flex-direction:column;gap:16px;padding:0 20px}
.mos .gr{padding:0}
.mz{position:relative}
.mzb{position:relative;display:block;border-radius:18px;overflow:hidden;text-decoration:none;color:#fff}
.mzb .ft{aspect-ratio:4/3;border-radius:0}
.mzb .ov{position:absolute;left:0;right:0;bottom:0;padding:56px 16px 14px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.72));display:flex;flex-direction:column;gap:3px}
.mzb .ov b{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.mzb .ov span{font-size:13px;font-weight:500;color:rgba(255,255,255,.92)}
.mz.big .mzb{border-radius:16px}
.mzb .ov b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mz.big .ov{padding:48px 14px 12px}
.mz.big .ov b{font-size:18px}
.mz.big .ov span{font-size:12px}
.mz.big .tag{top:10px;left:10px}
/* Discreet ranking: small number on the photo */
.rk{position:absolute;left:10px;bottom:10px;z-index:2;width:32px;height:32px;border-radius:50%;background:var(--tx);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* ---------- Lists (See all / results) ---------- */
.ph{display:flex;align-items:center;gap:14px;padding:20px 20px 4px}
.back{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #dcdad4;background:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.ph h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.ph p{margin:3px 0 0;font-size:13px;color:var(--mu)}
.lst{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;padding:18px 20px 0}
@media(min-width:620px){.lst{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px}}
.lc{width:auto}
.vacio{text-align:center;color:var(--mu);padding:64px 24px}
.vacio .ic{margin:0 auto}
.vacio b{display:block;color:var(--tx);font-size:17px;font-weight:700;margin-top:14px}
.vacio p{margin:6px 0 0;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #dcdad4;background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;text-decoration:none;margin-top:18px}
.sk{background:linear-gradient(90deg,#f1f0ec 25%,#f8f7f4 50%,#f1f0ec 75%);background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Plan page ---------- */
#ficha{position:fixed;inset:0;z-index:2800;background:#fff;transform:translateX(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}
#ficha.on{transform:none;visibility:visible;transition:transform .4s var(--ease),visibility 0s}
#fx-sc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
#fx{max-width:720px;margin:auto}
.fx-f{position:relative;width:100%;aspect-ratio:4/3;max-height:60vh;background:var(--c2);overflow:hidden}
.fx-f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(min-width:720px){.fx-f{border-radius:0 0 22px 22px}}
.fx-btns{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.fx-btns span{display:flex;gap:10px}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.rb svg{transition:fill .2s,stroke .2s}
.rb.on svg{fill:var(--ac);stroke:var(--ac)}
.cred{position:absolute;left:14px;bottom:32px;font-size:11px;font-weight:500;color:#fff;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:8px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-b{position:relative;margin-top:-22px;background:#fff;border-radius:22px 22px 0 0;padding:26px 22px 0}
.bds{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.cat{display:inline-flex;align-items:center;gap:6px;height:24px;font-size:13px;font-weight:600;color:var(--mu)}
.bd{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.bd.imp{background:var(--tx);color:#fff}.bd.sel{background:var(--soft)}
.bd.nuevo{background:#fff1ec;color:var(--ac2)}.bd.urge{background:#fdecec;color:#b42318}
.fx-b h1{font-size:29px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:0 0 10px}
.fx-sub{font-size:16px;color:var(--mu);line-height:1.5;margin:0}
.fx-meta{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;font-weight:700}
.fx-meta small{font-weight:500;color:var(--mu);font-size:14px}
hr.sp{border:0;border-top:1px solid var(--bd);margin:26px 0}
.facts{display:flex;flex-direction:column;gap:20px}
.fa{display:flex;gap:16px;align-items:flex-start}
.fa b{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.fa span{font-size:15px;line-height:1.5;color:#3a3a3e}
.fa a{color:var(--tx);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#bbb}
.d{font-size:17px;font-weight:500;line-height:1.55;letter-spacing:-.01em;margin:0}
.det{font-size:15px;line-height:1.7;margin:22px 0 0;color:#3a3a3e}
.blq{margin:28px 0 0}
h3.bt{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.blq ul{list-style:none;margin:0;padding:0}
.blq li{position:relative;padding-left:20px;margin:0 0 12px;font-size:15px;line-height:1.55}
.blq li:last-child{margin-bottom:0}
.blq li::before{content:'';position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--tx)}
.blq.tip li::before{background:var(--ac)}
.ideal{display:flex;flex-wrap:wrap;gap:8px}
.ideal span{font-size:13px;font-weight:600;padding:8px 13px;border-radius:18px;background:var(--soft)}
.mini{position:relative;height:200px;border-radius:16px;overflow:hidden;cursor:pointer;margin-bottom:14px;background:#f2f1ee}
.amp{position:absolute;top:10px;right:10px;z-index:900;display:inline-flex;align-items:center;gap:5px;background:#fffffff0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;box-shadow:0 1px 4px #0002;pointer-events:none}
.dir{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#bbb}
.st{fill:none;stroke:var(--tx);stroke-width:1.6;stroke-linejoin:round;flex:none;display:block}
.st.on{fill:var(--tx)}
.vt{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:14px}.vt.mu{color:var(--mu);font-weight:500;font-size:14px;margin-bottom:0}
.vt span{display:inline-flex;gap:2px}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;line-height:0}
textarea{width:100%;border:1px solid #dcdad4;border-radius:12px;padding:12px;font-size:16px;line-height:1.5;margin:14px 0 10px;resize:vertical}
.pri{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--tx);color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700}
.coms h4{font-size:17px;font-weight:800;margin:28px 0 14px}
.com{background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.6}
.com .s{display:flex;align-items:center;gap:2px;margin-bottom:6px;font-size:12px;color:var(--mu)}
.com .s em{font-style:normal;margin-left:6px}
.rep{display:block;margin:26px 0 8px;border:0;background:none;color:var(--mu);font-size:13px;padding:0;text-decoration:underline}
#fbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:12px 22px calc(12px + env(safe-area-inset-bottom))}
#fbar .in{max-width:676px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
#fbar b{display:block;font-size:18px;font-weight:800}
#fbar b.g{color:var(--ok)}
#fbar small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.cta{flex:none;height:50px;padding:0 22px;border-radius:12px;border:0;background:var(--ac2);color:#fff;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none}

/* ---------- Bottom nav ---------- */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:2100;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav.bn .in{max-width:720px;margin:auto;display:flex;height:var(--nav)}
nav.bn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--mu)}
nav.bn button.on{color:var(--ac2)}

/* ---------- Filters sheet ---------- */
#velo{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .3s;z-index:2500}
#velo.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;max-height:88vh;background:#fff;border-radius:22px 22px 0 0;z-index:2600;transform:translateY(105%);transition:transform .4s var(--ease);display:flex;flex-direction:column}
#sheet.on{transform:none}
.asa{width:40px;height:5px;border-radius:3px;background:#ddd;margin:10px auto 4px;flex:none}
#sheet-c{overflow-y:auto;padding:0 20px 16px}
#sheet-c h3{font-size:16px;font-weight:800;margin:22px 0 12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--mu)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px #0002}
.catb{display:inline-flex;align-items:center;gap:7px;border:1px solid #dcdad4;background:#fff;border-radius:20px;padding:9px 14px;font-size:14px;font-weight:600}
.catb .dot{background:var(--c)}
.catb.on{background:var(--c);color:#fff;border-color:var(--c)}.catb.on .dot{background:#fff}
.sheet-f{display:flex;gap:14px;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);flex:none}
.lnk{border:0;background:none;text-decoration:underline;font-size:14px;font-weight:600}
.aplica{flex:1;border:0;background:var(--tx);color:#fff;border-radius:12px;padding:15px;font-size:15px;font-weight:700}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}
.cal-h button{border:0;background:none;font-size:22px;padding:0 10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dn{font-size:12px;color:var(--mu)}
.dia{border:0;background:none;border-radius:50%;aspect-ratio:1;font-size:14px}
.dia.hoy{font-weight:800;color:var(--ac2)}.dia.on{background:var(--tx);color:#fff}.dia:disabled{color:#ccc}

/* ---------- Maps ---------- */
#mapa{height:calc(100dvh - var(--hdr) - var(--nav) - 36px - env(safe-area-inset-bottom));min-height:320px;border-radius:16px;overflow:hidden;margin:12px 20px 0}
#full{position:fixed;inset:0;z-index:3000;background:#fff;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}
#full.on{transform:none;visibility:visible;transition:transform .4s var(--ease),visibility 0s}
.full-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--bd);font-weight:700}
.full-top button{display:flex;align-items:center;justify-content:center;border:0;background:var(--soft);border-radius:50%;width:40px;height:40px;flex:none}
#full-map{flex:1}
#full-dir{display:flex;align-items:center;gap:8px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));font-size:15px;font-weight:600;border-top:1px solid var(--bd);text-decoration:none}
.pin{width:16px;height:16px;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px #0005}
.leaflet-container{font-family:inherit;background:#f2f1ee}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 4px 16px #0002}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.45}
.leaflet-popup-content button{margin-top:8px;border:0;background:var(--tx);color:#fff;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600}
.leaflet-bar{border:0!important;box-shadow:0 1px 4px #0002!important;border-radius:8px!important;overflow:hidden}
.leaflet-bar a{border:0!important;color:var(--tx)!important}
.leaflet-control-attribution{font-size:9px!important;background:#fffa!important}

#arriba{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:1500;width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 4px 16px #0000001f;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
#arriba.on{opacity:1;transform:none;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:4000;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== Dark theme (Spotify-like) ===== */
html.dark{--bg:#121212;--soft:#242424;--tx:#fff;--mu:#a7a7a7;--bd:#2a2a2a;--ok:#4ade80;--ac:var(--acc);--ac2:var(--acc);--cov:#232323;--covtx:#8a8a8a}
html.dark body{background:#121212;color:#fff}
.dark header{background:rgba(18,18,18,.62);-webkit-backdrop-filter:saturate(160%) blur(22px);backdrop-filter:saturate(160%) blur(22px)}
.dark header.sc{border-bottom-color:rgba(255,255,255,.06)}
.dark #q{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);color:#fff;box-shadow:none}

.dark .pill{background:#2a2a2a;color:#fff}

.dark .ft{--c2:var(--cov)!important;--c1:var(--covtx)!important}
.dark .tag{background:rgba(0,0,0,.62);color:#fff;box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dark .tag.imp{background:var(--acc);color:#0b0b0b}
.dark .rt strong{color:#fff}
.dark .todo .ft{background:#242424}.dark .todo .ci{background:#333;color:#fff}
.dark .li{border-bottom-color:#262626}

.dark nav.bn button{color:#a7a7a7}.dark nav.bn button.on{color:#fff}
.dark #arriba{background:rgba(40,40,40,.85);color:#fff;border-color:rgba(255,255,255,.08)}
.dark #ficha,.dark .fx-b{background:#121212}
.dark .rb{background:rgba(0,0,0,.55);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dark .fa span{color:#cfcfcf}.dark .fa a{color:#fff}
.dark .bd.imp{background:var(--acc);color:#0b0b0b}.dark .bd.sel{background:#2a2a2a;color:#fff}.dark .bd.urge{background:rgba(239,68,68,.16);color:#f87171}
.dark #fbar{background:rgba(24,24,24,.92);border-top:1px solid #262626;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dark .cta{background:var(--acc);color:#0b0b0b}
.dark .pri{background:#fff;color:#0b0b0b}
.dark textarea{background:#1e1e1e;border-color:#333;color:#fff}
.dark .com,.dark .ideal span{background:#1e1e1e}
.dark .st{stroke:#fff}.dark .st.on{fill:#fff}
.dark #sheet{background:#1e1e1e}.dark .seg{background:#2a2a2a}.dark .seg button.on{background:#3a3a3a;color:#fff}
.dark .catb{background:#2a2a2a;border-color:#2a2a2a;color:#fff}
.dark .dia{color:#fff}.dark .dia:disabled{color:#555}
.dark .mzb .ov{background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.78))}

/* Frosted-glass header (clearly blurred), solid bottom bar */
.dark header{background:rgba(22,22,22,.42)!important;-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(.9)!important;backdrop-filter:blur(26px) saturate(190%) brightness(.9)!important;border-bottom:1px solid rgba(255,255,255,.07)!important}
.dark nav.bn{background:#0e0e0e!important;border-top:1px solid #1f1f1f!important;padding-top:0!important}
/* Search: a round magnifier button that expands into the search bar */
.qbox{display:none;margin-bottom:0}
.hin.busca .qbox{display:block;animation:abreq .28s var(--ease)}
.hin.busca #rapidos{display:none}
@keyframes abreq{from{clip-path:inset(0 calc(100% - 44px) 0 0 round 26px);opacity:.6}to{clip-path:inset(0 0 0 0 round 26px);opacity:1}}
.chip.lupa{width:40px;padding:0;justify-content:center}
.dark #q{height:44px;border-radius:22px}
.hin.busca #qx{display:flex!important}
.logo{margin-bottom:12px}
.dark header,.dark header.sc{border-bottom:0!important;padding-bottom:22px;margin-bottom:-22px;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
.dark .hrt.on svg,.dark .li .hrt.on svg,.dark .rb.on svg{fill:#ff3b4f!important;stroke:#ff3b4f!important}

/* ===== v4: orange accent, glass chips, theme toggle ===== */
:root{--ac:#ff5a1f;--ac2:#e8490f;--acc:#ff5a1f;--heart:#ff3b4f}
/* Header glass + soft fade (both themes) */
header,header.sc{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border-bottom:0!important;padding-bottom:22px;margin-bottom:-22px;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
/* Liquid-glass chips */
.chip{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.9);color:var(--tx);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(0,0,0,.05),0 0 0 .5px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.08)}
.dark .chip{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);color:#fff;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.32),inset 0 -1px 2px rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.35)}
.chip.on,.dark .chip.on{background:linear-gradient(180deg,#ff7a45,#ff5a1f);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 6px 18px rgba(255,90,31,.35)}
#q{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);height:44px;border-radius:22px;box-shadow:inset 0 1px 1px #fff,0 0 0 .5px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dark #q{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
/* Must-do label: neutral, never the accent */
.tag.imp,.bd.imp{background:#111;color:#fff}
.dark .tag.imp,.dark .bd.imp{background:#fff;color:#0b0b0b}
/* Hearts always red */
.hrt.on svg,.li .hrt.on svg,.rb.on svg,.dark .hrt.on svg,.dark .li .hrt.on svg,.dark .rb.on svg{fill:var(--heart)!important;stroke:var(--heart)!important}
/* Theme toggle */
.logo{justify-content:space-between}
.tema{width:40px;height:40px;padding:0;justify-content:center;border-radius:50%}
nav.bn{background:#fff;border-top:1px solid #eeece8;-webkit-backdrop-filter:none;backdrop-filter:none}
#q:focus{border-color:rgba(255,90,31,.55)}
.tema .sol{display:none}.dark .tema .sol{display:block}.dark .tema .luna{display:none}

/* ===== v5: Spotify/Apple progressive-blur header + liquid-glass chips ===== */
html header#hdr,html header#hdr.sc{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;-webkit-mask-image:none!important;mask-image:none!important;border-bottom:0!important;padding-bottom:30px;margin-bottom:-30px}
.vid{position:absolute;inset:0;z-index:-1;pointer-events:none}
.vid i{position:absolute;inset:0}
.vid i:nth-child(1){-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
.vid i:nth-child(2){-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 calc(100% - 38px),transparent calc(100% - 12px));mask-image:linear-gradient(#000 calc(100% - 38px),transparent calc(100% - 12px))}
.vid i:nth-child(3){-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);-webkit-mask-image:linear-gradient(#000 calc(100% - 48px),transparent calc(100% - 22px));mask-image:linear-gradient(#000 calc(100% - 48px),transparent calc(100% - 22px))}
.vid i:nth-child(4){-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);-webkit-mask-image:linear-gradient(#000 calc(100% - 60px),transparent calc(100% - 32px));mask-image:linear-gradient(#000 calc(100% - 60px),transparent calc(100% - 32px))}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.86),rgba(255,255,255,.66) calc(100% - 44px),rgba(255,255,255,0));transition:opacity .35s var(--ease)}
.dark .vid::after{background:linear-gradient(rgba(18,18,18,.88),rgba(18,18,18,.62) calc(100% - 44px),rgba(18,18,18,0))}
/* Liquid-glass buttons */
.chip,.dark .chip{position:relative;isolation:isolate;border:1px solid transparent;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s,box-shadow .3s}
.chip::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.2px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.25) 35%,rgba(190,170,255,.45) 65%,rgba(255,255,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.chip{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.05);backdrop-filter:blur(18px) saturate(190%) brightness(1.05);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.07),0 6px 16px rgba(0,0,0,.08);color:var(--tx)}
.dark .chip{background:rgba(42,42,42,.42);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.2);backdrop-filter:blur(18px) saturate(190%) brightness(1.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.35);color:#fff}
.dark .chip::before{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 38%,rgba(185,160,255,.35) 68%,rgba(255,255,255,.4))}
.chip:active{transform:scale(.93)}
.chip.on,.dark .chip.on{background:var(--acc);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 6px 18px rgba(255,90,31,.3)}
.chip.on::before{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,0) 50%,rgba(255,255,255,.35))}
.dark #q{background:rgba(42,42,42,.5);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%)}
/* Fluid motion */
.hin.busca .qbox{animation:abreq .45s cubic-bezier(.34,1.3,.64,1)}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s}

/* ===== v6: no clipped-shadow line, neutral selected state, smooth close ===== */
#rapidos{padding-top:14px;padding-bottom:14px;margin-top:-14px;margin-bottom:-14px}
.chip{box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05)}
.dark .chip{box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 3px 10px rgba(0,0,0,.28)}
.chip.on{background:#1d1d1f;color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.12)}
.dark .chip.on{background:#fff;color:#0b0b0b;box-shadow:inset 0 -1px 1px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.28)}
.chip.on::before{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0) 50%,rgba(255,255,255,.25))}
.chip .n{background:var(--tx);color:var(--bg)}
.chip.on .n{background:var(--bg);color:var(--tx)}
#q:focus,.dark #q:focus{border-color:rgba(127,127,127,.28)}
nav.bn button.on{color:var(--tx)}
#vista,main{transition:opacity .25s var(--ease)}

/* ===== v7: flat tonal buttons, orange active tab, morphing search ===== */
.chip,.dark .chip{background:#f1f1f1;border:1px solid transparent;color:var(--tx);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;transition:transform .35s cubic-bezier(.34,1.5,.64,1),background .25s,color .25s}
.dark .chip{background:#2a2a2a;color:#fff}
.chip::before,.dark .chip::before{display:none}
.chip.on,.dark .chip.on{box-shadow:none}
.chip.on{background:#1d1d1f;color:#fff}.dark .chip.on{background:#fff;color:#0b0b0b}
nav.bn button.on,html.dark nav.bn button.on{color:var(--acc)}
.hin{position:relative}
.qbox,.hin.busca .qbox{display:block;position:absolute;left:20px;right:20px;top:0;height:44px;margin:0;visibility:hidden;pointer-events:none;z-index:3;animation:none}
.hin.busca .qbox{visibility:visible;pointer-events:auto}
.hin.busca #rapidos{display:flex}
.hin.busca #rapidos>*{opacity:0;pointer-events:none}
#q,.dark #q{height:44px;border-radius:22px;border:0;box-shadow:none;background:#f1f1f1;-webkit-backdrop-filter:none;backdrop-filter:none;padding-left:42px}
.dark #q{background:#2a2a2a}
#q:focus,.dark #q:focus{border:0}
.qbox>.ic{left:11px}

/* Active tab: filled icon */
:root{--navbg:#fff}html.dark{--navbg:#0e0e0e}
nav.bn button.on svg>*{fill:currentColor}
nav.bn button.on svg>*:nth-child(2){fill:var(--navbg);stroke:var(--navbg)}

/* ===== v8: natural single-pass blur, translucent buttons ===== */
.vid i:nth-child(n+3){display:none}
.vid i:nth-child(1){-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(#000 calc(100% - 46px),rgba(0,0,0,.75) calc(100% - 32px),rgba(0,0,0,.4) calc(100% - 18px),rgba(0,0,0,.12) calc(100% - 7px),transparent);mask-image:linear-gradient(#000 calc(100% - 46px),rgba(0,0,0,.75) calc(100% - 32px),rgba(0,0,0,.4) calc(100% - 18px),rgba(0,0,0,.12) calc(100% - 7px),transparent)}
.vid i:nth-child(2){-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);-webkit-mask-image:linear-gradient(#000 calc(100% - 70px),rgba(0,0,0,.7) calc(100% - 52px),rgba(0,0,0,.35) calc(100% - 38px),rgba(0,0,0,.1) calc(100% - 26px),transparent calc(100% - 14px));mask-image:linear-gradient(#000 calc(100% - 70px),rgba(0,0,0,.7) calc(100% - 52px),rgba(0,0,0,.35) calc(100% - 38px),rgba(0,0,0,.1) calc(100% - 26px),transparent calc(100% - 14px))}
.vid::after{background:linear-gradient(rgba(255,255,255,.78),rgba(255,255,255,.62) calc(100% - 56px),rgba(255,255,255,.44) calc(100% - 38px),rgba(255,255,255,.2) calc(100% - 20px),rgba(255,255,255,.05) calc(100% - 7px),rgba(255,255,255,0))}
.dark .vid::after{background:linear-gradient(rgba(18,18,18,.78),rgba(18,18,18,.6) calc(100% - 56px),rgba(18,18,18,.42) calc(100% - 38px),rgba(18,18,18,.18) calc(100% - 20px),rgba(18,18,18,.05) calc(100% - 7px),rgba(18,18,18,0))}
.chip,#q{background:rgba(236,236,236,.62);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.dark .chip,.dark #q{background:rgba(60,60,60,.45);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.chip.on{background:rgba(29,29,31,.92)}.dark .chip.on{background:rgba(255,255,255,.94)}

/* ===== v9: blur ends right under the buttons ===== */

/* ===== v16: calmer home ===== */
.fila{padding-top:40px}
.fh{padding-bottom:16px}
.vt-b.sa,.dark .vt-b.sa{width:auto;height:auto;border:0;background:none;padding:6px 0 6px 8px;gap:2px;font-size:14px;font-weight:700;color:var(--mu);border-radius:0}
.vt-b.sa .ic{margin-right:-4px}
.dtabs{position:relative;display:flex;gap:4px;margin:0 20px 14px;padding:4px;border-radius:14px;background:#f1f1f1;width:max-content;max-width:calc(100% - 40px)}
.dark .dtabs{background:#232323}
.dind{position:absolute;top:4px;bottom:4px;left:0;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .38s cubic-bezier(.32,.72,0,1),width .38s cubic-bezier(.32,.72,0,1)}
.dark .dind{background:#3a3a3a;box-shadow:none}
.dtab{position:relative;z-index:1;border:0;background:none;height:34px;padding:0 14px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;color:var(--mu);display:inline-flex;align-items:center;gap:6px;transition:color .25s}
.dtab.on{color:var(--tx)}
.dtab small{font-size:11px;font-weight:700;opacity:.55}
.dpane{display:none}.dpane.on{display:flex}
.fila .rc.wide{width:min(76vw,310px)}

/* ===== v17: weekend module (its own panel + calendar tiles), subtle Our pick label ===== */
.fila.wk{margin:40px 12px 0;padding:22px 0 20px;border-radius:26px;background:linear-gradient(160deg,#f6f1ea,#efeee9)}
.dark .fila.wk{background:linear-gradient(160deg,#211c19,#1a1a1a);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06)}
.fila.wk .fh{padding:0 18px 16px}
.fila.wk .carr{padding:0 18px 4px;scroll-padding-left:18px}
.fila.wk .dtabs{background:none;padding:0;margin:0 18px 18px;gap:10px;border-radius:0;max-width:none}
.fila.wk .dind{top:0;bottom:0;border-radius:18px;background:var(--tx);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.dark .fila.wk .dind{background:#fff}
.fila.wk .dtab{flex-direction:column;justify-content:center;gap:0;height:auto;width:78px;padding:10px 0 9px;border-radius:18px;background:rgba(0,0,0,.04);color:var(--tx)}
.dark .fila.wk .dtab{background:rgba(255,255,255,.06)}
.fila.wk .dtab small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.fila.wk .dtab b{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.fila.wk .dtab i{font-style:normal;font-size:10.5px;font-weight:700;opacity:.55}
.fila.wk .dtab.on{color:var(--bg);background:none}
.fila.wk .dtab.on small,.fila.wk .dtab.on i{opacity:.75}
.tag.pick{gap:4px;background:rgba(255,255,255,.88);color:#111}
.dark .tag.pick{background:rgba(0,0,0,.55);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tag.pick svg{fill:currentColor;stroke:none}

/* dark mode: white fills need dark text */
.dark .aplica,.dark .dia.on,.dark .rk,.dark .leaflet-popup-content button,.dark #toast{color:#0b0b0b}
.dark .dia.on{background:#fff}
.dark .dia.hoy:not(.on){color:var(--acc)}

/* ===== v18: motion polish ===== */
.asa-z{padding:6px 0 10px;cursor:grab;touch-action:none;flex:none}
.asa-z .asa{margin:4px auto 0}
.sx{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.06);color:var(--tx);display:flex;align-items:center;justify-content:center;z-index:2}
.dark .sx{background:rgba(255,255,255,.1)}
.dark .asa{background:#444}
#sheet{will-change:transform}
.chip{transition:background-color .32s ease,color .32s ease,border-color .32s ease,box-shadow .32s ease,transform .35s cubic-bezier(.34,1.5,.64,1)}
.dia{transition:background-color .25s ease,color .25s ease}

.dark .catb.on{background:var(--c);border-color:var(--c);color:#fff}
.dark .catb.on .dot{background:#fff}
#cal{touch-action:pan-y}

/* Slides must never widen the page (iOS Safari would zoom out to fit) */
main{overflow-x:hidden;overflow-x:clip}


/* ===== Plan page v2 ===== */
/* buttons fixed on top, glass like the home filters */
#ficha>.fx-btns{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;z-index:40;display:flex;justify-content:space-between;pointer-events:none}

#ficha .rb{width:42px;height:42px;background:rgba(20,20,20,.42);color:#fff;-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.18)}
#ficha .rb.on svg{fill:#ff3b4f;stroke:#ff3b4f}

#fx-top{position:absolute;left:0;right:0;top:0;z-index:35;height:calc(96px + env(safe-area-inset-top));pointer-events:none;visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s .35s}
#ficha.sc #fx-top{opacity:1;visibility:visible;transition:opacity .35s ease}
#ficha.sc .rb{background:rgba(127,127,127,.18);color:var(--tx);box-shadow:inset 0 0 0 .5px rgba(127,127,127,.25)}
/* compact key info: one card, icon + value */
.facts{gap:0;background:var(--soft);border-radius:18px;padding:4px 16px}
.fa{gap:12px;padding:12px 0;align-items:center}
.fa+.fa{border-top:1px solid rgba(127,127,127,.14)}
.fa svg{width:19px;height:19px;flex:none;opacity:.8}
.fa b{display:none}
.fa span{font-size:14.5px;line-height:1.35}
/* same look as the home page */
.bt{font-size:20px;letter-spacing:-.03em}
.cred{background:rgba(20,20,20,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px}
.cta,.dark .cta{border-radius:25px;color:#fff}

/* plan page: blur higher up and softer */

// ===== Hide obvious duplicates (same event imported twice) - keeps the better of the two =====
function sinRepetidos(arr){
 const STOP=new Set(['de','la','le','les','des','du','en','et','el','los','las','au','aux','the','of','and','paris','par','con','una','une','pour','para','sur','with','at']);
 const tk=p=>new Set(sinAc(p.nombre).replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w.length>2&&!STOP.has(w)));
 const cp=s=>(String(s||'').match(/\b75(?:0\d\d|116)\b/)||[null])[0];
 const fk=u=>String(u||'').split('?')[0].replace(/^https?:\/\/(www\.)?/,'').toLowerCase();
 const m=(a,b)=>{const r=Math.PI/180,x=(b.lat-a.lat)*r,y=(b.lon-a.lon)*r,h=Math.sin(x/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
 const sol=(a,b)=>(a.fecha_inicio||'0000')<=(b.fecha_fin||b.fecha_inicio||'9999')&&(b.fecha_inicio||'0000')<=(a.fecha_fin||a.fecha_inicio||'9999');
 const jac=(A,B)=>{let i=0;for(const w of A)if(B.has(w))i++;return i/(A.size+B.size-i)};
 const vago=p=>!p.lugar||/^\s*(paris)?\s*(\d{1,2}\s*(e|er|eme|ème|th|st|nd|rd)?|750\d\d)?\s*(paris)?\s*$/i.test(String(p.lugar));
 const IMPW=new Set(IMP_EV.flatMap(k=>sinAc(k).replace(/[^a-z0-9]+/g,' ').split(' ')));
 const ACT=new Set(['visit','visits','visite','visites','guided','guidee','tour','tours','workshop','workshops','atelier','ateliers','talk','talks','conference','rencontre','screening','projection','concert','concerts','party','soiree','brunch','opening','vernissage','nocturne','late','night','musical','musicale','musicales','kids','enfants','performance','masterclass','dj','set','live']);
 const cl=t=>new Set([...t].filter(w=>!/^\d+$/.test(w)&&!IMPW.has(w)));
 // only OBVIOUS duplicates are hidden here (the robot asks the AI about the doubtful ones)
 const mismo=(a,b,t0,u0)=>{if(!sol(a,b))return false;const ta=cl(t0),tb=cl(u0);if(!ta.size||!tb.size)return false;
  const fa=a.foto_original||a.foto,fb=b.foto_original||b.foto,fi=fa&&fb&&fk(fa)===fk(fb),d=a.lat!=null&&b.lat!=null?m(a,b):null,ca=cp(a.lugar),cb=cp(b.lugar);
  const[pe,gr]=ta.size<=tb.size?[ta,tb]:[tb,ta],cont=[...pe].every(w=>gr.has(w));
  if(!((cont&&(pe.size>=2||(pe.size===gr.size&&[...pe][0].length>=6)))||jac(ta,tb)>=.8))return false;
  if([...gr].some(w=>!pe.has(w)&&ACT.has(w)))return false;
  if(fi)return true;if(vago(a)||vago(b))return d==null?(!ca||!cb||ca===cb):d<2500;if(d!=null)return d<500;return!ca||!cb||ca===cb};
 const val=p=>(p.imprescindible?50:0)+(+p.nota||0)*3+(p.foto?4:0)+(p.lat!=null?2:0)+(p.lugar&&!/^\s*paris\b/i.test(p.lugar)?3:0)+(p.horario?1:0)+Math.min(3,String(p.descripcion||'').length/300)+(Array.isArray(p.puntos)&&p.puntos.length?2:0);
 const T=arr.map(tk),fuera=new Set();
 for(let i=0;i<arr.length;i++){if(fuera.has(i))continue;for(let j=i+1;j<arr.length;j++){if(fuera.has(j))continue;
  if(mismo(arr[i],arr[j],T[i],T[j])){if(val(arr[j])>val(arr[i])){fuera.add(i);break}fuera.add(j)}}}
 return fuera.size?arr.filter((_,i)=>!fuera.has(i)):arr;
}

 if(tema!==st.tema||tdia!==st.tdia||String(lista)!==String(st.lista)){const entra=!st.tema&&!st.lista&&(tema||lista),sale=(st.tema||st.lista)&&!tema&&!lista;if(entra)_yInicio=scrollY;_destY=sale?_yInicio:0;st.tema=tema;st.tdia=tdia;st.lista=lista;pintar();if(_destY!=null){scrollTo(0,_destY);_destY=null}}

 else if(ds.qx){cerrarBusca()}
 else if(ds.abrirf)abrirSheet();
 else if(ds.minfo){const c=$('mcred');c.hidden=!c.hidden}
 else if(ds.sharelist)compartirLista();
 else if(ds.limpiar){const vivos=new Set(st.datos.map(p=>p.id));[...favs].forEach(id=>{if(!vivos.has(id))favs.delete(id)});guardar('favs',[...favs]);document.querySelectorAll('.nfc').forEach(x=>{x.textContent=favs.size;x.hidden=!favs.size});pintarLista()}
 else if(ds.guardartodo){st.lista.forEach(id=>favs.add(id));guardar('favs',[...favs]);document.querySelectorAll('.nfc').forEach(x=>{x.textContent=favs.size;x.hidden=!favs.size});pintarLista()}
 else if(ds.cerrars)cerrarSheet();
 else if(ds.aplicar){cerrarSheet();scrollTo(0,0)}
 else if(ds.borrar){st.dias=new Set();st.cats=new Set();st.gratis=false;st.sel=false;st.q='';$('q').value='';pintar()}
 else if(ds.rap){const arr=conj(ds.rap);st.dias=igual(st.dias,arr)?new Set():new Set(arr);pintar();if(!sheetOn)scrollTo(0,0)}
 else if(ds.precio){st.gratis=ds.precio==='gratis';pintar()}
 else if(ds.qgratis){st.gratis=!st.gratis;pintar()}
 else if(ds.qsel){st.sel=!st.sel;pintar()}
 else if('cat' in ds){st.cats.has(ds.cat)?st.cats.delete(ds.cat):st.cats.add(ds.cat);pintar()}
 else if(ds.qdias){st.dias=new Set();pintar()}
 else if(ds.mes)cambiarMes(Number(ds.mes));
 else if(ds.dia){st.dias.has(ds.dia)?st.dias.delete(ds.dia):st.dias.add(ds.dia);pintar()}
});

// ===== Motion: chips, content cross-fade, page slides, draggable filter sheet =====
function setRapidos(html){
 const R=$('rapidos');if(!R)return;
 const t=document.createElement('div');t.innerHTML=html;const nu=[...t.children],vi=[...R.children];
 const igualForma=nu.length===vi.length&&nu.every((n,i)=>JSON.stringify(n.dataset)===JSON.stringify(vi[i].dataset));
 if(!igualForma||document.querySelector('.hin.busca')){R.innerHTML=html;return}
 nu.forEach((n,i)=>{const v=vi[i];
  if(v.dataset.abrirf&&v.innerHTML!==n.innerHTML){        // Filters chip: smooth resize between "Filters" and the counter
   const w0=v.getBoundingClientRect().width,eraN=!!v.querySelector('.n');
   v.className=n.className;v.innerHTML=n.innerHTML;v.setAttribute('aria-label',n.getAttribute('aria-label')||'');
   const w1=v.getBoundingClientRect().width,esN=!!v.querySelector('.n'),ease='cubic-bezier(.32,.72,0,1)';
   if(Math.abs(w1-w0)>1){v.style.overflow='hidden';const a=v.animate([{width:w0+'px'},{width:w1+'px'}],{duration:420,easing:ease});a.onfinish=a.oncancel=()=>{v.style.overflow=''}}
   const nn=v.querySelector('.n'),fl=v.querySelector('.fl');
   if(nn&&!eraN)nn.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1.12)',offset:.7},{opacity:1,transform:'none'}],{duration:420,easing:'ease-out'});
   else if(nn)nn.animate([{transform:'scale(1.25)'},{transform:'none'}],{duration:300,easing:'ease-out'});
   if(fl&&eraN)fl.animate([{opacity:0,transform:'translateX(-6px)'},{opacity:1,transform:'none'}],{duration:380,delay:60,easing:ease,fill:'backwards'});
   return}
  if(v.className!==n.className)v.className=n.className;if(v.innerHTML!==n.innerHTML)v.innerHTML=n.innerHTML});
}
const firmaFiltros=()=>JSON.stringify([[...st.dias].sort(),[...st.cats].sort(),st.gratis,st.sel,st.vista]);
let _firma=null,_tema=undefined,_pag=undefined;
const _pintarLista=pintarLista;
pintarLista=function(){
 const L=$('lista'),f=firmaFiltros(),tm=st.tema?st.tema+(st.tdia||''):null,listo=st.cargado;
 const pag=st.vista+'|'+(st.fav?1:0),antesP=_pag;
 const antesF=_firma,antesT=_tema;_firma=f;_tema=tm;_pag=pag;
 if(!listo||antesT===undefined||matchMedia('(prefers-reduced-motion: reduce)').matches){_pintarLista();return}
 const M=document.querySelector('main');
 M.getAnimations().forEach(a=>a.cancel());L.getAnimations().forEach(a=>a.cancel());
 if(antesP!==undefined&&pag!==antesP){   // Explore / Map / Saved: the page dissolves and the new one rises in softly
  const a=M.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.985)'}],{duration:150,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
  a.onfinish=()=>{_pintarLista();a.cancel();
   M.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:400,easing:'cubic-bezier(.22,.8,.2,1)'});
   if(st.vista==='mapa'&&typeof mapa!=='undefined'&&mapa&&mapa.invalidateSize)setTimeout(()=>mapa.invalidateSize(),60)};
  return}
 if(tm!==antesT){            // "See all" opens (slides in from the right) or closes (back from the left)
  const dentro=tm&&!antesT,y=_destY;_destY=null;
  const entrar=()=>L.animate([{opacity:0,transform:`translateX(${dentro?'72px':'-48px'})`},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.32,.72,0,1)'});
  const irY=()=>{if(y!=null)scrollTo(0,y)};
  if(y==null||Math.abs(scrollY-y)<60){_pintarLista();irY();entrar();return}
  // far down the page: fade out first, swap and jump while invisible, then slide in (no visible jump)
  const a=L.animate([{opacity:1},{opacity:0}],{duration:130,easing:'ease-in',fill:'forwards'});
  a.onfinish=()=>{_pintarLista();irY();a.cancel();entrar()};
  return}
 if(f!==antesF){            // a filter changed: quick fade out, new content fades in (Spotify-style)
  const a=L.animate([{opacity:1},{opacity:0}],{duration:120,easing:'ease-in',fill:'forwards'});
  a.onfinish=()=>{_pintarLista();a.cancel();L.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})};
  return}
 _pintarLista();
};
(function(){
 const sh=$('sheet'),sc=$('sheet-c');let y0=null,dy=0,t0=0,arrastra=false;
 sh.addEventListener('touchstart',e=>{if(!sh.classList.contains('on'))return;const enAsa=!!e.target.closest('.asa-z');
  if(!enAsa&&sc.scrollTop>0)return;if(e.target.closest('.cal-g,.row,input'))return;
  y0=e.touches[0].clientY;dy=0;t0=Date.now();arrastra=enAsa},{passive:true});
 sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;
  if(!arrastra){if(dy>8&&sc.scrollTop<=0)arrastra=true;else if(dy<0){y0=null;return}}
  if(arrastra){if(e.cancelable)e.preventDefault();sh.style.transition='none';sh.style.transform=`translateY(${Math.max(0,dy)}px)`;$('velo').style.opacity=String(Math.max(0,1-dy/400))}},{passive:false});
 const fin=()=>{if(y0==null)return;const v=dy/Math.max(1,Date.now()-t0);y0=null;sh.style.transition='';$('velo').style.opacity='';
  if(arrastra&&(dy>110||v>.6)){sh.style.transform='';cerrarSheet()}else sh.style.transform='';arrastra=false};
 sh.addEventListener('touchend',fin);sh.addEventListener('touchcancel',fin);
})();

// Calendar: change month with the arrows or by swiping left/right
function cambiarMes(d){
 const n=new Date(st.mes.getFullYear(),st.mes.getMonth()+d,1),h=new Date();
 if(n<new Date(h.getFullYear(),h.getMonth(),1)){const g=document.querySelector('#cal .cal-g');g&&g.animate([{transform:'none'},{transform:'translateX(14px)'},{transform:'none'}],{duration:260,easing:'ease-out'});return}
 st.mes=n;pintarCal();
 const g=document.querySelector('#cal .cal-g'),t=document.querySelector('#cal .cal-h b');
 const k={duration:380,easing:'cubic-bezier(.32,.72,0,1)'};
 g&&g.animate([{opacity:0,transform:`translateX(${d>0?44:-44}px)`},{opacity:1,transform:'none'}],k);
 t&&t.animate([{opacity:0,transform:`translateX(${d>0?16:-16}px)`},{opacity:1,transform:'none'}],k);
}
(function(){let x0=null,y0=null;
 document.addEventListener('touchstart',e=>{const c=e.target.closest('#cal');if(!c){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;

})();

async function compartirLista(){
 const ids=st.datos.filter(p=>favs.has(p.id)).map(p=>p.id);if(!ids.length)return;
 const link=location.origin+location.pathname+'?lista='+ids.join(',');
 if(navigator.share){try{await navigator.share({title:'My Paris plans',text:'My plans in Paris',url:link})}catch(_){}return}
 try{await navigator.clipboard.writeText(link);toast('Link copied')}catch(_){window.open('https://wa.me/?text='+encodeURIComponent('My plans in Paris '+link),'_blank')}
}
async function cargar(){
 try{
  const [r1,r2]=await Promise.all([api('planes?select=*&estado=eq.aprobado&or=(fecha_fin.gte.'+HOY+',fecha_fin.is.null)'),Promise.resolve({ok:false})||api('resumen_valoraciones?select=*')]);
  if(!r1.ok)throw 0;
  st.datos=sinRepetidos((await r1.json()).filter(p=>{const f=futuras(p);return !f||f.length}));
  st.datos.forEach(p=>{if(p.imprescindible&&soloParte(p.nombre))p.imprescindible=false});
  if(r2.ok)(await r2.json()).forEach(x=>st.rat[x.plan_id]={media:Number(x.media),total:x.total});
  PICK=new Set(st.datos.filter(p=>(p.nota||0)>=PICK_MIN).sort((a,b)=>(b.nota||0)-(a.nota||0)||(b.imprescindible?1:0)-(a.imprescindible?1:0)||proxima(a).localeCompare(proxima(b))).slice(0,PICKS).map(p=>p.id));
  st.cargado=true;
 }catch(_){st.error=true}
 st.tema=null;pintar();ruta();
}
