<!DOCTYPE html>

<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#ff4d2e;--bd:#e6e4df;--ok:#1e7a3c;--ease:cubic-bezier(.2,.8,.2,1);--hdr:170px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:15px;margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit}
.ic{flex:none;display:block}
/* Translucent header */
header{position:sticky;top:0;z-index:2000;padding:12px 16px 4px;background:rgba(250,249,247,.72);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid rgba(0,0,0,.06)}

.lang{position:absolute;right:0;top:50%;transform:translateY(-50%)}

.grp{position:relative}

.impc{flex:none;width:min(76vw,270px);height:176px;scroll-snap-align:start;text-align:left;border:0;border-radius:18px;padding:16px;background:var(--tx);color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.impc .et{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.12);color:#ffb199;font-size:11px;font-weight:600;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.impc b{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.impc .s{font-size:13px;color:#ffffffb3;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.impc .f{margin-top:auto;font-size:12px;color:#ffffff99}

.st{fill:none;stroke:var(--tx);stroke-width:1.6;stroke-linejoin:round;flex:none;display:block}
.st.on{fill:var(--tx)}

.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px #0000000f,0 0 0 1px #0000000a;cursor:pointer;scroll-margin-top:calc(var(--hdr) + 44px);transition:box-shadow .35s var(--ease),transform .35s var(--ease)}

.top{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:24px}
.cat{display:inline-flex;align-items:center;gap:6px;height:22px;font-size:12px;font-weight:500;color:var(--mu)}
.bd{display:inline-flex;align-items:center;gap:4px;height:22px;margin:0;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.bd.imp{background:var(--tx);color:#fff;margin:0}.bd.sel{background:#f1efe9;color:var(--tx)}

.meta .g{color:var(--ok);font-weight:600}
.sep{color:#c4c2bd}
.rat{display:inline-flex;align-items:center;gap:6px;color:var(--tx);font-weight:600}

.card.ab .mas{transform:none}

.blq{margin:0 0 26px}

.blq.tip li::before{background:var(--ac)}
.ideal{display:flex;flex-wrap:wrap;gap:8px}
.ideal span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:20px;background:#f1efe9}
.det{font-size:15px;line-height:1.7;margin:0 0 24px;color:#3a3a3c}
.mini{position:relative;height:170px;border-radius:14px;margin:0 0 18px;overflow:hidden;cursor:pointer}
.amp{position:absolute;top:8px;right:8px;z-index:900;display:inline-flex;align-items:center;gap:5px;background:#fffffff0;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;box-shadow:0 1px 4px #0002;pointer-events:none}
.acc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:500;text-decoration:none}
.btn.pri{background:var(--tx);color:#fff;border-color:var(--tx)}
.val{margin-top:24px;padding-top:18px;border-top:1px solid var(--bd)}
.vt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:12px}.vt.mu{color:var(--mu);font-weight:400;font-size:13px;margin-bottom:0}
.vt span{display:inline-flex;gap:2px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;line-height:0}
textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px;line-height:1.5;margin:12px 0 10px;resize:vertical;color:var(--tx)}
.coms h4{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:26px 0 12px}
.com{background:#f7f6f3;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6}
.com .s{display:flex;align-items:center;gap:2px;margin-bottom:6px;font-size:12px;color:var(--mu)}
.com .s em{font-style:normal;margin-left:6px}
.rep{display:block;margin-top:20px;border:0;background:none;color:var(--mu);font-size:13px;padding:0;text-decoration:underline}
.chev{display:flex;justify-content:center;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--mu);margin-top:12px;cursor:pointer}

.catb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:20px;padding:8px 13px;font-size:14px;font-weight:500}

.leaflet-container{font-family:inherit;background:#f2f1ee}

/* Back to top */
#arriba{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:1500;width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 4px 16px #0000001f;display:flex;align-items:center;justify-content:center;color:var(--tx);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}

#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>

 if(abierto!=null){const c=tarjetaDe(abierto);if(c)c.classList.remove('ab');soltarMini()}
 if(abierto===id){abierto=null;return}
 abierto=id;const c=tarjetaDe(id);if(!c)return;
 c.classList.add('ab');montarMini();cargarComs(id);
 setTimeout(()=>{if(mini)mini.invalidateSize();irA(id,donde)},460);
}
async function cargarComs(id){
 try{
  const r=await api(`comentarios_publicos?plan_id=eq.${id}&order=creado_en.desc&limit=20`);if(!r.ok)return;
  const d=await r.json(),box=$('coms-'+id);if(!box)return;
  box.innerHTML=d.length?`<h4>${t('opiniones')}</h4>`+d.map(c=>`<div class="com"><div class="s">${estrellas(c.estrellas,13)}<em>· ${new Date(c.creado_en).toLocaleDateString(t('loc'),{day:'numeric',month:'short'})}</em></div>${e(c.comentario)}</div>`).join(''):'';
 }catch(_){}
}
function pintarLista(){
 $('lista').hidden=st.vista==='mapa';$('mapa').hidden=st.vista!=='mapa';
 if(!st.cargado){$('lista').innerHTML=`<div class="vacio">${t('cargando')}</div>`;return}
 const l=filtrar();
 if(!l.length){
  $('lista').innerHTML=`<div class="vacio">${I('search',30)}<b>${t('vacio')}</b><p>${t('vacioSub')}</p>${numFiltros()||st.q?`<button class="btn" data-borrar="1">${t('quitar')}</button>`:''}</div>`;
  if(st.vista==='mapa')pintarMapa(l);return;
 }
 const a=l.filter(p=>p.tipo!=='largo'),b=l.filter(p=>p.tipo==='largo'),imps=l.filter(p=>p.imprescindible);
 const man=conj('manana')[0],fs=new Set(finde());
 const grupo=p=>{const d=proxima(p);return d===HOY?'g_hoy':d===man?'g_man':fs.has(d)?'g_finde':'g_prox'};
 let h='';
 if(imps.length)h+=`<section class="imp"><h3 class="sec">${I('flame',18)}${t('impTit')} <small>${t('impSub')}</small></h3><div class="carr">${imps.map(p=>`<button class="impc" data-ir="${p.id}"><span class="et">${I('flame',12)}${t('imp')}</span><b>${e(tx(p,'nombre'))}</b>${tx(p,'subtitulo')?`<span class="s">${e(tx(p,'subtitulo'))}</span>`:''}<span class="f">${e([fechas(p),precioTx(p)].filter(Boolean).join(' · '))}</span></button>`).join('')}</div></section>`;
 if(a.length){
  h+=`<h3 class="sec">${I('bolt',18)}${t('bloqueA')} <small>${a.length}</small></h3>`;
  for(const g of ['g_hoy','g_man','g_finde','g_prox']){const arr=a.filter(p=>grupo(p)===g);if(arr.length)h+=`<section class="grp"><div class="sub">${t(g)}</div>${arr.map(tarjeta).join('')}</section>`}
 }
 if(b.length)h+=`<h3 class="sec">${I('leaf',18)}${t('bloqueB')} <small>${b.length}</small></h3>`+b.map(tarjeta).join('');
 $('lista').innerHTML=h;
 montarMini();if(abierto!=null)cargarComs(abierto);
 if(st.vista==='mapa')pintarMapa(l);
}
function pintar(){pintarCabecera();pintarLista();if(sheetOn)pintarSheet()}
let tt;function toast(m){const x=$('toast');x.textContent=m;x.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('on'),2400)}
async function reportar(id){
 const m=prompt(t('preg'));if(!m||!m.trim())return;
 try{const r=await api('reportes',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({plan_id:id,motivo:m.trim().slice(0,300)})});toast(r.ok?t('gracias'):t('noenv'))}catch(_){toast(t('noenv'))}
}
async function enviarVoto(id){
 const n=selEst[id];if(!n){toast(t('eligeEst'));return}
 const com=(($('txt-'+id)||{}).value||'').trim().slice(0,500);
 try{
  const r=await api('valoraciones',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({plan_id:id,dispositivo:DEV,estrellas:n,comentario:com||null})});
  if(!r.ok&&r.status!==409){toast(t('noenv'));return}
  if(r.ok){const x=st.rat[id]||{media:0,total:0};x.media=(x.media*x.total+n)/(x.total+1);x.total++;st.rat[id]=x}
  misVotos[id]=n;guardar('votos',misVotos);toast(r.ok?t('graciasVoto'):t('yaVotado'));
  const p=st.datos.find(x=>x.id===id);
  if($('val-'+id))$('val-'+id).innerHTML=valHTML(p);
  if($('rat-'+id))$('rat-'+id).innerHTML=ratHTML(id);
  cargarComs(id);
 }catch(_){toast(t('noenv'))}
}
async function compartir(id){
 const p=st.datos.find(x=>x.id===id);if(!p)return;
 const link=location.origin+location.pathname+'?plan='+id,tit=tx(p,'nombre');
 if(navigator.share){try{await navigator.share({title:tit,text:t('compartirTxt')+': '+tit,url:link})}catch(_){}return}
 window.open('https://wa.me/?text='+encodeURIComponent(t('compartirTxt')+': '+tit+' '+link),'_blank');
}
$('qicon').insertAdjacentHTML('afterbegin',I('search',17));
$('full-x').innerHTML=I('x',18);
$('arriba').innerHTML=I('up',20);
$('q').addEventListener('input',ev=>{st.q=ev.target.value;pintarLista();if(sheetOn)pintarSheet()});
addEventListener('scroll',()=>$('arriba').classList.toggle('on',scrollY>700),{passive:true});
addEventListener('resize',setHdr);
if(document.fonts)document.fonts.ready.then(setHdr);
document.addEventListener('click',ev=>{
 if(langOpen&&!ev.target.closest('.lang')){langOpen=false;pintarCabecera()}
 if(ev.target.id==='velo'){cerrarSheet();return}
 const b=ev.target.closest('button');
 if(!b){
  if(ev.target.closest('a,textarea,input'))return;
  const mi=ev.target.closest('.mini');if(mi){abrirFull(+mi.dataset.full);return}
  if(ev.target.closest('.mas'))return;
  const c=ev.target.closest('.card');if(c)abrir(+c.dataset.id);
  return;
 }
 const ds=b.dataset;
 if(ds.arriba)scrollTo({top:0,behavior:'smooth'});
 else if(ds.langmenu){langOpen=!langOpen;pintarCabecera()}
 else if(ds.lang){LANG=ds.lang;langOpen=false;try{localStorage.setItem('lang',LANG)}catch(_){};document.documentElement.lang=LANG;pintar()}
 else if(ds.cerrar)cerrarFull();
 else if(ds.ir){const id=+ds.ir;if(abierto===id)irA(id,'start');else abrir(id,'start')}
 else if(ds.ver){st.vista='lista';abierto=+ds.ver;if(mapa)mapa.closePopup();pintar();irA(abierto,'start')}
 else if(ds.fav){const id=+ds.fav;favs.has(id)?favs.delete(id):favs.add(id);guardar('favs',[...favs]);b.classList.toggle('on',favs.has(id));b.classList.remove('pop');void b.offsetWidth;if(favs.has(id))b.classList.add('pop');if(st.fav)pintar()}
 else if(ds.share)compartir(+ds.share);
 else if(ds.rep)reportar(+ds.rep);
 else if(ds.star){const pid=+ds.pid,n=+ds.star;selEst[pid]=n;document.querySelectorAll(`[data-pid="${pid}"]`).forEach(x=>x.innerHTML=STAR(+x.dataset.star<=n,30))}
 else if(ds.enviar)enviarVoto(+ds.enviar);
 else if(ds.vista){st.vista=ds.vista;pintar()}
 else if(ds.abrirf)abrirSheet();
 else if(ds.aplicar)cerrarSheet();
 else if(ds.borrar){st.dias=new Set();st.cats=new Set();st.gratis=false;st.sel=false;st.fav=false;st.q='';$('q').value='';pintar()}
 else if(ds.rap){const arr=conj(ds.rap);st.dias=igual(st.dias,arr)?new Set():new Set(arr);pintar()}
 else if(ds.precio){st.gratis=ds.precio==='gratis';pintar()}
 else if(ds.qgratis){st.gratis=!st.gratis;pintar()}
 else if(ds.qsel){st.sel=!st.sel;pintar()}
 else if('cat' in ds){st.cats.has(ds.cat)?st.cats.delete(ds.cat):st.cats.add(ds.cat);pintar()}
 else if(ds.qfav){st.fav=!st.fav;pintar()}
 else if(ds.qdias){st.dias=new Set();pintar()}
 else if(ds.mes){const n=new Date(st.mes.getFullYear(),st.mes.getMonth()+Number(ds.mes),1),h=new Date();if(n>=new Date(h.getFullYear(),h.getMonth(),1)){st.mes=n;pintarCal()}}
 else if(ds.dia){st.dias.has(ds.dia)?st.dias.delete(ds.dia):st.dias.add(ds.dia);pintar()}
});
async function cargar(){
 try{
  const [r1,r2]=await Promise.all([api('planes?select=*&estado=eq.aprobado&or=(fecha_fin.gte.'+HOY+',fecha_fin.is.null)'),api('resumen_valoraciones?select=*')]);
  if(!r1.ok)throw 0;
  st.datos=(await r1.json()).filter(p=>{const f=futuras(p);return !f||f.length});
  if(r2.ok)(await r2.json()).forEach(x=>st.rat[x.plan_id]={media:Number(x.media),total:x.total});
  st.cargado=true;
  const qp=+new URLSearchParams(location.search).get('plan');
  if(qp&&st.datos.some(p=>p.id===qp))abierto=qp;
  pintar();
  if(abierto!=null)irA(abierto,'start');
 }catch(_){$('lista').innerHTML=`<div class="vacio">${t('error')}</div>`}
}
document.documentElement.lang=LANG;pintar();cargar();
</script></body></html>
