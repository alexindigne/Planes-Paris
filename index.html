main{max-width:640px;margin:auto;padding:12px}
.sec{font-size:16px;margin:18px 4px 10px}.sec small{color:var(--mu);font-weight:400}

.card.ab .plega.res{grid-template-rows:0fr;opacity:0}
.mas{padding-top:12px;transform:translateY(-10px);transition:transform .5s var(--ease)}
.card.ab .mas{transform:none}
.d{font-size:15px;font-weight:600;margin:0 0 10px;line-height:1.4}
.det{font-size:15px;line-height:1.6;margin:0 0 12px;color:#333}

function filtrar(){
 const q=sinAc(st.q.trim());
 return st.datos.filter(p=>(!st.gratis||esGratis(p))&&(!st.cats.size||st.cats.has(p.categoria))&&(!st.fav||favs.has(p.id))
  &&(!st.dias.size||[...st.dias].some(d=>enDia(p,d)))
  &&(!q||sinAc([tx(p,'nombre'),p.nombre,p.lugar,p.organizador,t('cats')[p.categoria]].join(' ')).includes(q)))
  .sort((a,b)=>proxima(a).localeCompare(proxima(b))||(a.fecha_fin||'').localeCompare(b.fecha_fin||''));
}
function badges(p){
 const b=[];
 if(p.creado_en&&Date.now()-new Date(p.creado_en)<48*3600e3)b.push(`<span class="bd nuevo">${t('nuevo')}</span>`);
 if(p.fecha_fin===HOY)b.push(`<span class="bd urge">${t('ultimo')}</span>`);
 else if(p.fecha_fin&&p.tipo==='largo'&&diasEntre(HOY,p.fecha_fin)<=3)b.push(`<span class="bd urge">${t('pronto')}</span>`);
 return b.join('');
}
function ratHTML(id){const r=st.rat[id];return r&&r.total?`★ ${Number(r.media).toLocaleString(t('loc'),{minimumFractionDigits:1,maximumFractionDigits:1})} <small>(${r.total})</small>`:''}
function valHTML(p){
 const mio=misVotos[p.id];
 if(mio)return `<div class="vt">${t('tuVoto')} <span class="sv">${estrellas(mio)}</span></div>`;
 if(p.fecha_inicio&&p.fecha_inicio>HOY)return `<div class="vt mu">⭐ ${t('desde')}${corta(p.fecha_inicio)}</div>`;
 const s=selEst[p.id]||0;
 return `<div class="vt">${t('valorar')}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button data-star="${n}" data-pid="${p.id}">${n<=s?'★':'☆'}</button>`).join('')}</div>
 <textarea id="txt-${p.id}" maxlength="500" rows="3" placeholder="${e(t('comPh'))}"></textarea><button class="btn pri" data-enviar="${p.id}">${t('enviar')}</button>`;
}
function tarjeta(p){
 const c=CAT[p.categoria]||CAT.otro,url=urlOk(p),fe=fechas(p),fl=fechasLargas(p),nom=tx(p,'nombre'),hor=tx(p,'horario'),det=tx(p,'detalle');
 const org=p.organizador&&p.organizador!=='Que faire à Paris'?p.organizador:'';
 return `<article class="card${abierto===p.id?' ab':''}" data-id="${p.id}" style="--c:${c.c}">
 <div class="top"><span class="cat">${c.i} ${e(t('cats')[p.categoria]||t('cats').otro)}</span>${badges(p)}<button class="fav" data-fav="${p.id}">${favs.has(p.id)?'❤️':'🤍'}</button></div>
 <h2>${e(nom)}</h2>
 <div class="meta"><span class="p${esGratis(p)?' g':''}">${e(precioTx(p))}</span>${fe?`<span>📅 ${e(fe)}</span>`:''}<span class="rat" id="rat-${p.id}">${ratHTML(p.id)}</span></div>
 <div class="plega res"><div><div class="l">📍 ${e(p.lugar)}</div></div></div>
 <div class="plega abre"><div><div class="mas">
  <p class="d">${e(tx(p,'descripcion'))}</p>
  ${det?`<p class="det">${e(det)}</p>`:''}
  ${fl?`<div class="fila"><span>📅</span><span>${e(fl)}</span></div>`:''}
  ${hor?`<div class="fila"><span>🕐</span><span>${e(hor)}</span></div>`:''}
  <div class="fila"><span>📍</span><a class="dir" href="${e(mapsLink(p))}" target="_blank" rel="noopener">${e(p.lugar)} ↗</a></div>
  ${org?`<div class="fila"><span>👤</span><span>${e(t('org')+org)}</span></div>`:''}
  ${p.lat!=null&&p.lon!=null?`<div class="mini" id="mini-${p.id}" data-full="${p.id}"><span class="amp">⤢ ${t('ampliar')}</span></div>`:''}
  <div class="acc">${url?`<a class="btn pri" href="${e(url)}" target="_blank" rel="noopener">${t('info')}</a>`:''}<button class="btn" data-ics="${p.id}">📅 ${t('calendario')}</button><button class="btn" data-share="${p.id}">↗ ${t('compartir')}</button></div>
  <div class="val" id="val-${p.id}">${valHTML(p)}</div>
  <div class="coms" id="coms-${p.id}"></div>
  <button class="rep" data-rep="${p.id}">${t('reportar')}</button>
 </div></div></div>
 <div class="chev"><span class="vM">${t('mas')}</span><span class="vm">${t('menos')}</span><span class="flecha">▾</span></div></article>`;
}
function pintarCabecera(){
 $('tit').textContent=NOMBRE;document.title=NOMBRE;
 $('lang').innerHTML=['es','fr','en'].map(l=>`<button data-lang="${l}" class="${l===LANG?'on':''}">${l.toUpperCase()}</button>`).join('');
 $('q').placeholder=t('buscar');
 $('vista').innerHTML=`<button data-vista="lista" class="${st.vista==='lista'?'on':''}" aria-label="Lista">☰</button><button data-vista="mapa" class="${st.vista==='mapa'?'on':''}" aria-label="Mapa">🗺️</button>`;
 const nf=numFiltros();
 $('rapidos').innerHTML=`<button class="chip${nf?' on':''}" data-abrirf="1">⚙️ ${t('filtros')}${nf?`<span class="n">${nf}</span>`:''}</button>
 <button class="chip${igual(st.dias,conj('hoy'))?' on':''}" data-rap="hoy">${t('hoy')}</button>
 <button class="chip${igual(st.dias,conj('finde'))?' on':''}" data-rap="finde">${t('finde')}</button>
 <button class="chip${st.gratis?' on':''}" data-qgratis="1">${t('gratis')}</button>`;
 let pills=[...st.cats].map(c=>`<button class="pill" style="--c:${CAT[c].c}" data-cat="${c}">${CAT[c].i} ${t('cats')[c]} ✕</button>`);
 if(st.dias.size&&!igual(st.dias,conj('hoy'))&&!igual(st.dias,conj('finde')))pills.unshift(`<button class="pill" data-qdias="1">📅 ${st.dias.size} ${st.dias.size>1?t('dias'):t('dia')} ✕</button>`);
 if(st.fav)pills.push(`<button class="pill" data-qfav="1">❤️ ${t('guardados')} ✕</button>`);
 $('pills').innerHTML=pills.join('');
}
function pintarCal(){
 const el=$('cal');if(!el)return;
 const y=st.mes.getFullYear(),mo=st.mes.getMonth(),prim=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate();
 let h=`<div class="cal-h"><button data-mes="-1">‹</button><b>${st.mes.toLocaleDateString(t('loc'),{month:'long',year:'numeric'})}</b><button data-mes="1">›</button></div><div class="cal-g">`
  +t('dn').map(d=>`<span class="dn">${d}</span>`).join('')+'<span></span>'.repeat(prim);
 for(let d=1;d<=n;d++){const s=iso(new Date(y,mo,d));h+=`<button class="dia${st.dias.has(s)?' on':''}${s===HOY?' hoy':''}" data-dia="${s}"${s<HOY?' disabled':''}>${d}</button>`}
 el.innerHTML=h+'</div>';
}
function pintarSheet(){
 $('sheet-c').innerHTML=`<h3>${t('cuando')}</h3><div class="wrap">${['hoy','manana','finde'].map(k=>`<button class="chip${igual(st.dias,conj(k))?' on':''}" data-rap="${k}">${t(k)}</button>`).join('')}</div><div id="cal" style="margin-top:14px"></div>
 <h3>${t('precio')}</h3><div class="seg" style="display:inline-flex"><button class="${!st.gratis?'on':''}" data-precio="todo">${t('todo')}</button><button class="${st.gratis?'on':''}" data-precio="gratis">${t('gratis')}</button></div>
 <h3>${t('categorias')}</h3><div class="wrap">${CATS.map(c=>`<button class="catb${st.cats.has(c)?' on':''}" style="--c:${CAT[c].c}" data-cat="${c}">${CAT[c].i} ${t('cats')[c]}</button>`).join('')}</div>
 <h3>${t('guardados')}</h3><div class="wrap"><button class="chip${st.fav?' on':''}" data-qfav="1">❤️ ${t('guardados')}</button></div>`;
 pintarCal();
 $('verN').textContent=t('verN').replace('{n}',filtrar().length);
 $('borrarT').textContent=t('borrarTodo');
}
let mapa,capa,mini,full;
function pintarMapa(l){
 if(!mapa){mapa=L.map('mapa').setView([48.8566,2.3522],12);base(mapa);capa=L.layerGroup().addTo(mapa)}
 setTimeout(()=>mapa.invalidateSize(),50);capa.clearLayers();const pts=[];
 l.forEach(p=>{if(p.lat==null||p.lon==null)return;pts.push([p.lat,p.lon]);const fe=fechas(p);
  L.marker([p.lat,p.lon],{icon:pinDe(p)}).addTo(capa).bindPopup(`<b>${e(tx(p,'nombre'))}</b><br>${e(precioTx(p))}${fe?' · '+e(fe):''}<br><button data-ver="${p.id}">${t('ver')}</button>`)});
 if(pts.length)mapa.fitBounds(pts,{padding:[30,30],maxZoom:15});
}
function montarMini(){
 if(mini){mini.remove();mini=null}
 if(abierto==null||st.vista!=='lista')return;
 const p=st.datos.find(x=>x.id===abierto),el=$('mini-'+abierto);
 if(!p||!el)return;
 mini=L.map(el,{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false}).setView([p.lat,p.lon],15);
 base(mini);L.marker([p.lat,p.lon],{icon:pinDe(p)}).addTo(mini);
}
function soltarMini(){const m=mini;mini=null;if(m)setTimeout(()=>m.remove(),500)}
function abrirFull(id){
 const p=st.datos.find(x=>x.id===id);if(!p||p.lat==null)return;
 $('full-t').textContent=tx(p,'nombre');
 const a=$('full-dir');a.href=mapsLink(p);a.textContent='📍 '+p.lugar+' ↗';
 $('full').classList.add('on');document.body.style.overflow='hidden';
 setTimeout(()=>{if(full)full.remove();full=L.map('full-map').setView([p.lat,p.lon],16);base(full);L.marker([p.lat,p.lon],{icon:pinDe(p)}).addTo(full);setTimeout(()=>full.invalidateSize(),350)},60);
}
function cerrarFull(){$('full').classList.remove('on');document.body.style.overflow='';setTimeout(()=>{if(full){full.remove();full=null}},450)}
function abrirSheet(){sheetOn=true;pintarSheet();$('sheet').classList.add('on');$('velo').classList.add('on');document.body.style.overflow='hidden'}
function cerrarSheet(){sheetOn=false;$('sheet').classList.remove('on');$('velo').classList.remove('on');document.body.style.overflow=''}
const tarjetaDe=id=>document.querySelector(`.card[data-id="${id}"]`);
function irA(id,donde){requestAnimationFrame(()=>{const c=tarjetaDe(id);if(c)c.scrollIntoView({behavior:'smooth',block:donde||'nearest'})})}
function abrir(id){
 if(abierto!=null){const c=tarjetaDe(abierto);if(c)c.classList.remove('ab');soltarMini()}
 if(abierto===id){abierto=null;return}
 abierto=id;const c=tarjetaDe(id);if(!c)return;
 c.classList.add('ab');montarMini();cargarComs(id);
 setTimeout(()=>{if(mini)mini.invalidateSize();irA(id)},460);
}
async function cargarComs(id){
 try{
  const r=await api(`comentarios_publicos?plan_id=eq.${id}&order=creado_en.desc&limit=20`);if(!r.ok)return;
  const d=await r.json(),box=$('coms-'+id);if(!box)return;
  box.innerHTML=d.length?`<h4>${t('opiniones')}</h4>`+d.map(c=>`<div class="com"><div class="s">${estrellas(c.estrellas)} <span>· ${new Date(c.creado_en).toLocaleDateString(t('loc'),{day:'numeric',month:'short'})}</span></div>${e(c.comentario)}</div>`).join(''):'';
 }catch(_){}
}
function pintarLista(){
 $('lista').hidden=st.vista==='mapa';$('mapa').hidden=st.vista!=='mapa';
 if(!st.cargado){$('lista').innerHTML=`<p class="vacio">${t('cargando')}</p>`;return}
 const l=filtrar(),a=l.filter(p=>p.tipo!=='largo'),b=l.filter(p=>p.tipo==='largo');
 const sec=(ti,arr)=>arr.length?`<h3 class="sec">${ti} <small>${arr.length}</small></h3>`+arr.map(tarjeta).join(''):'';
 $('lista').innerHTML=l.length?sec(t('bloqueA'),a)+sec(t('bloqueB'),b):`<p class="vacio">${t('vacio')}</p>`;
 montarMini();if(abierto!=null)cargarComs(abierto);
 if(st.vista==='mapa')pintarMapa(l);
}
function pintar(){pintarCabecera();pintarLista();if(sheetOn)pintarSheet()}
let tt;function toast(m){const x=$('toast');x.textContent=m;x.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('on'),2400)}
async function reportar(id){
 const m=prompt(t('preg'));if(!m||!m.trim())return;
 try{const r=await api('reportes',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({plan_id:id,motivo:m.trim().slice(0,300)})});toast(r.ok?t('gracias'):t('noenv'))}catch(_){toast(t('noenv'))}
}
async function enviarVoto(id){
 const n=selEst[id];if(!n){toast(t('eligeEst'));return}
 const com=(($('txt-'+id)||{}).value||'').trim().slice(0,500);
 try{
  const r=await api('valoraciones',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({plan_id:id,dispositivo:DEV,estrellas:n,comentario:com||null})});
  if(!r.ok&&r.status!==409){toast(t('noenv'));return}
  if(r.ok){const x=st.rat[id]||{media:0,total:0};x.media=(x.media*x.total+n)/(x.total+1);x.total++;st.rat[id]=x}
  misVotos[id]=n;guardar('votos',misVotos);toast(r.ok?t('graciasVoto'):t('yaVotado'));
  const p=st.datos.find(x=>x.id===id);
  if($('val-'+id))$('val-'+id).innerHTML=valHTML(p);
  if($('rat-'+id))$('rat-'+id).innerHTML=ratHTML(id);
  cargarComs(id);
 }catch(_){toast(t('noenv'))}
}
async function compartir(id){
 const p=st.datos.find(x=>x.id===id);if(!p)return;
 const link=location.origin+location.pathname+'?plan='+id,tit=tx(p,'nombre');
 if(navigator.share){try{await navigator.share({title:tit,text:t('compartirTxt')+': '+tit,url:link})}catch(_){}return}
 window.open('https://wa.me/?text='+encodeURIComponent(t('compartirTxt')+': '+tit+' '+link),'_blank');
}
function calendario(id){
 const p=st.datos.find(x=>x.id===id);if(!p)return;
 const ini=p.tipo==='largo'?proxima(p):(p.fecha_inicio||p.fecha_fin||HOY),fin=p.tipo==='largo'?ini:(p.fecha_fin||ini);
 const sig=parse(fin);sig.setDate(sig.getDate()+1);
 const f=s=>s.replace(/-/g,''),esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n');
 const desc=[tx(p,'horario'),tx(p,'descripcion'),urlOk(p)].filter(Boolean).join('\n');
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PlanesParis//ES','BEGIN:VEVENT','UID:plan-'+p.id+'@planes-paris','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+f(ini),'DTEND;VALUE=DATE:'+f(iso(sig)),'SUMMARY:'+esc(tx(p,'nombre')),'LOCATION:'+esc(p.lugar),'DESCRIPTION:'+esc(desc),'END:VEVENT','END:VCALENDAR'].join('\r\n');
 if(IOS){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);return}
 const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='plan.ics';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
}
$('q').addEventListener('input',ev=>{st.q=ev.target.value;pintarLista();if(sheetOn)pintarSheet()});
document.addEventListener('click',ev=>{
 if(ev.target.id==='velo'){cerrarSheet();return}
 const b=ev.target.closest('button');
 if(!b){
  if(ev.target.closest('a,textarea,input'))return;
  const mi=ev.target.closest('.mini');if(mi){abrirFull(+mi.dataset.full);return}
  if(ev.target.closest('.mas'))return;
  const c=ev.target.closest('.card');if(c)abrir(+c.dataset.id);
  return;
 }
 const ds=b.dataset;
 if(ds.lang){LANG=ds.lang;guardar('lang',LANG);try{localStorage.setItem('lang',LANG)}catch(_){};document.documentElement.lang=LANG;pintar()}
 else if(ds.cerrar)cerrarFull();
 else if(ds.ver){st.vista='lista';abierto=+ds.ver;if(mapa)mapa.closePopup();pintar();irA(abierto,'start')}
 else if(ds.fav){const id=+ds.fav;favs.has(id)?favs.delete(id):favs.add(id);guardar('favs',[...favs]);b.textContent=favs.has(id)?'❤️':'🤍';if(st.fav)pintar()}
 else if(ds.share)compartir(+ds.share);
 else if(ds.ics)calendario(+ds.ics);
 else if(ds.rep)reportar(+ds.rep);
 else if(ds.star){const pid=+ds.pid,n=+ds.star;selEst[pid]=n;document.querySelectorAll(`[data-pid="${pid}"]`).forEach(x=>x.textContent=+x.dataset.star<=n?'★':'☆')}
 else if(ds.enviar)enviarVoto(+ds.enviar);
 else if(ds.vista){st.vista=ds.vista;pintar()}
 else if(ds.abrirf)abrirSheet();
 else if(ds.aplicar)cerrarSheet();
 else if(ds.borrar){st.dias=new Set();st.cats=new Set();st.gratis=false;st.fav=false;pintar()}
 else if(ds.rap){const arr=conj(ds.rap);st.dias=igual(st.dias,arr)?new Set():new Set(arr);pintar()}
 else if(ds.precio){st.gratis=ds.precio==='gratis';pintar()}
 else if(ds.qgratis){st.gratis=!st.gratis;pintar()}
 else if('cat' in ds){st.cats.has(ds.cat)?st.cats.delete(ds.cat):st.cats.add(ds.cat);pintar()}
 else if(ds.qfav){st.fav=!st.fav;pintar()}
 else if(ds.qdias){st.dias=new Set();pintar()}
 else if(ds.mes){const n=new Date(st.mes.getFullYear(),st.mes.getMonth()+Number(ds.mes),1),h=new Date();if(n>=new Date(h.getFullYear(),h.getMonth(),1)){st.mes=n;pintarCal()}}
 else if(ds.dia){st.dias.has(ds.dia)?st.dias.delete(ds.dia):st.dias.add(ds.dia);pintar()}
});
async function cargar(){
 try{
  const [r1,r2]=await Promise.all([api('planes?select=*&estado=eq.aprobado&or=(fecha_fin.gte.'+HOY+',fecha_fin.is.null)'),api('resumen_valoraciones?select=*')]);
  if(!r1.ok)throw 0;
  st.datos=await r1.json();
  if(r2.ok)(await r2.json()).forEach(x=>st.rat[x.plan_id]={media:Number(x.media),total:x.total});
  st.cargado=true;
  const qp=+new URLSearchParams(location.search).get('plan');
  if(qp&&st.datos.some(p=>p.id===qp))abierto=qp;
  pintar();
  if(abierto!=null)irA(abierto,'start');
 }catch(_){$('lista').innerHTML=`<p class="vacio">${t('error')}</p>`}
}
document.documentElement.lang=LANG;pintar();cargar();
</script></body></html>
