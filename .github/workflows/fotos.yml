name: Photos to our storage

on:
  schedule:
    - cron: '40 6 * * *'   # every day, after the other robots
  workflow_dispatch:

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node fotos.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
