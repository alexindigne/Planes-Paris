name: Importar planes
on:
  schedule:
    - cron: '0 5 * * 3'   # every Wednesday, 6-7am Paris time
  workflow_dispatch:
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Official agenda
        run: node importar.js
      - name: Web search + duplicates
        if: always()
        run: node buscar.js
